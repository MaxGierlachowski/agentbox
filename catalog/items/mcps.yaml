  # ── Mail, chat, calendar, documents ──────────────────────────────────────────────────
  - id: mcp.gmail
    kind: mcp
    name: Gmail
    summary: Search and read mail, manage labels and create drafts (Google's hosted MCP).
    source: [curated]
    tier: T0
    licence: Proprietary
    roles: [manager, founder-ops, support]
    install:
      mcp:
        transport: http
        url: https://gmailmcp.googleapis.com/mcp/v1
        oauth:
          client_id: ${GOOGLE_OAUTH_CLIENT_ID}
          client_secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
    auth: { type: oauth }
    env: &google-oauth-client
      - name: GOOGLE_OAUTH_CLIENT_ID
        secret: false
        description: OAuth client id (Desktop app) from your Google Cloud project.
        help_url: https://developers.google.com/workspace/guides/configure-mcp-servers
      - name: GOOGLE_OAUTH_CLIENT_SECRET
        secret: true
        description: The matching OAuth client secret.
        help_url: https://developers.google.com/workspace/guides/configure-mcp-servers
    targets: [hermes]
    pinned_version: null
    homepage: https://developers.google.com/workspace/gmail/api/guides/configure-mcp-server
    tags: [email, google]
    notes: >-
      Google's MCP servers have no dynamic client registration. Create one OAuth client in a
      Google Cloud project, enable the Gmail API and its MCP service, then sign in inside the
      box browser. The same client works for Calendar and Drive.

  - id: mcp.google-calendar
