  # ── Databases and analytics ───────────────────────────────────────────────────────────
  - id: mcp.postgres
    kind: mcp
    name: Postgres (read-only)
    summary: Explore schemas, run read-only SQL and check query plans and health.
    source: [curated]
    tier: T0
    licence: MIT
    roles: [developer, data, devops]
    install:
      mcp:
        transport: stdio
        command: uvx
        args: ["postgres-mcp==0.3.0", "--access-mode=restricted"]
        env:
          DATABASE_URI: ${DATABASE_URI}
    auth: { type: api_key }
    env:
      - name: DATABASE_URI
        secret: true
        description: postgresql://user:password@host:5432/dbname (prefer a read-only role).
        help_url: https://github.com/crystaldba/postgres-mcp#configuration
    targets: [hermes]
    pinned_version: 0.3.0
    homepage: https://github.com/crystaldba/postgres-mcp
    requires: [cli.uv]
    tags: [sql, database]
    notes: Restricted mode runs read-only transactions with an execution time limit.

  - id: mcp.duckdb
