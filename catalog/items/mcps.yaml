    auth: { type: oauth }
    env: *google-oauth-client
    targets: [hermes]
    pinned_version: null
    homepage: https://developers.google.com/workspace/guides/configure-mcp-servers
    tags: [calendar, google]
    notes: Needs your own Google OAuth client and the Calendar MCP service enabled (see Gmail).

