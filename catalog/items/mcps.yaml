# MCP servers. Every entry is a public server with a documented install spec:
#   - stdio packages are pinned to an exact npm/PyPI version (npx -y pkg@ver, uvx pkg==ver)
#   - hosted servers use the URL their vendor documents (homepage / help_url)
# `${NAME}` refers to an entry in `env`, `${gh.token}` to the token of the authenticated gh CLI.
items:
  # ── Box ───────────────────────────────────────────────────────────────────────────────
  - id: mcp.paseo
    kind: mcp
    name: Paseo
    summary: Start, watch and steer Paseo coding agents (Claude Code) from Hermes.
    source: [curated]
    tier: T0
    licence: Apache-2.0
    roles: []
    install:
      mcp:
        transport: stdio
        command: node
        args: [/opt/agentbox/vendor/paseo-mcp/0.4.0/paseo-mcp/dist/index.js]
        env:
          PASEO_MCP_CONFIG: /home/agentbox/.config/paseo-mcp/config.json
    targets: [hermes]
    pinned_version: 0.4.0
    homepage: https://github.com/MaxGierlachowski/paseo-mcp
    notes: Vendored by agentbox from the paseo-mcp release tarball; config rendered by agentbox.

  # ── Code hosting and developer docs ───────────────────────────────────────────────────
  - id: mcp.github
    kind: mcp
    name: GitHub
    summary: Issues, pull requests, code search and Actions on github.com.
    source: [curated]
    tier: T0
    licence: MIT
    roles: [developer, devops]
    install:
      mcp:
        transport: http
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: Bearer ${gh.token}
    auth: { type: derived, from: cli.gh }
    targets: [hermes, paseo]
    pinned_version: null
    homepage: https://github.com/github/github-mcp-server
    requires: [cli.gh]
    tags: [git, code-review]

  - id: mcp.gitlab
    kind: mcp
    name: GitLab
    summary: Issues, merge requests, pipelines and repo context on gitlab.com.
    source: [curated]
