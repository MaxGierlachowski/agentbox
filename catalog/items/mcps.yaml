  - id: mcp.brave-search
    kind: mcp
    name: Brave Search
    summary: Web, news, image and local search through the Brave Search API.
    source: [curated]
    tier: T0
    licence: MIT
    roles: [manager, founder-ops, designer-marketer]
    install:
      mcp:
        transport: stdio
        command: npx
        args: ["-y", "@brave/brave-search-mcp-server@2.2.0"]
        env:
          BRAVE_API_KEY: ${BRAVE_API_KEY}
    auth: { type: api_key }
    env:
      - name: BRAVE_API_KEY
        secret: true
        description: Brave Search API key (free plan available).
        help_url: https://brave.com/search/api/
    targets: [hermes]
    pinned_version: 2.2.0
    homepage: https://github.com/brave/brave-search-mcp-server
