    roles: [developer, devops]
    install:
      mcp: { transport: http, url: https://gitlab.com/api/v4/mcp }
    auth: { type: oauth }
    targets: [hermes]
    pinned_version: null
    homepage: https://docs.gitlab.com/user/model_context_protocol/mcp_server/
    tags: [git, code-review]
    notes: For self-managed GitLab 18.6+ point the URL at https://<host>/api/v4/mcp.

  - id: mcp.context7
    kind: mcp
    name: Context7
    summary: Up-to-date, version-specific library documentation and code examples.
    source: [curated]
