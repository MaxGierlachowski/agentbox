  - id: mcp.playwright
    kind: mcp
    name: Playwright
    summary: Headless, isolated browser automation for testing web apps.
    source: [curated]
    tier: T0
    licence: Apache-2.0
    roles: [developer]
    install:
      mcp:
        transport: stdio
        command: npx
        args: ["-y", "@playwright/mcp@0.0.86", "--headless", "--isolated", "--browser", "chromium"]
    targets: [hermes, paseo]
    pinned_version: 0.0.86
    homepage: https://github.com/microsoft/playwright-mcp
    tags: [browser, testing]
    notes: >-
      Runs its own throwaway headless Chromium (npx playwright install chromium). It never
