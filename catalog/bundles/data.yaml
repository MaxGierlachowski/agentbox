first_task: >-
  Download a small public dataset (for example a CSV from data.gov) into ~/work/data, load it
  into DuckDB and tell me what is in it and five questions it could answer.
first_task_alternatives:
  - Connect to my Postgres database read-only and explain the schema of its ten largest tables.
  - Profile the CSV file I upload next - columns, types, missing values and outliers.
  - Build a small self-updating dashboard for a metric I name, and show me the query behind it.
