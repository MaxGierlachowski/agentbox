name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Playwright browser (UI tests)
        working-directory: e2e
        run: bunx playwright install --with-deps chromium
      - name: Biome
        run: bunx biome ci .
      - name: Module boundaries
        run: bunx depcruise apps packages --config .dependency-cruiser.cjs
      - name: Catalog
        run: bun run catalog:validate
      - name: Shell scripts
        run: shellcheck -S warning packages/providers/src/host/scripts/*.sh scripts/install.sh
      - run: bunx turbo typecheck lint test
      - name: Build binaries (UI and catalog embedded)
        run: bun run --cwd apps/agentbox compile --target linux-x64 --target linux-arm64
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: agentbox-binaries
          path: apps/agentbox/dist/agentbox-linux-*
          retention-days: 7
