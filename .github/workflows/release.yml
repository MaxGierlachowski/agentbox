# Tag vX.Y.Z[-rc.N] → build the release (companion tarballs, binaries, install.sh, SHA256SUMS)
# and publish it as a GitHub (pre-)release. Companion repos are built from `companion_ref`.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      companion_ref:
        description: Branch or tag of hermes-ui / paseo-multi-account / hermes-paseo-bridge
        default: v1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      REF: ${{ inputs.companion_ref || 'v1' }}
    steps:
      - uses: actions/checkout@v4
        with: { path: agentbox }
      - uses: actions/checkout@v4
        with: { repository: MaxGierlachowski/hermes-ui, ref: "${{ env.REF }}", path: hermes-ui }
      - uses: actions/checkout@v4
        with: { repository: MaxGierlachowski/paseo-multi-account, ref: "${{ env.REF }}", path: paseo-multi-account }
      - uses: actions/checkout@v4
        with: { repository: MaxGierlachowski/hermes-paseo-bridge, ref: "${{ env.REF }}", path: hermes-paseo-bridge }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: agentbox/package.json }
      - name: Build
        working-directory: agentbox
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          bun install --frozen-lockfile
          (cd ../hermes-ui && npm ci --no-audit --no-fund)
          (cd ../paseo-multi-account && npm ci --no-audit --no-fund)
          bun scripts/release.ts --targets linux-x64,linux-arm64,darwin-arm64,darwin-x64
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: agentbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME}"
          PRE=""; case "$V" in *-*) PRE=--prerelease ;; esac
          gh release create "$V" $PRE --title "agentbox $V" --notes-file docs/release-notes.md \
            apps/agentbox/dist/release/*
