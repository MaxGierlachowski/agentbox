# Tag vX.Y.Z[-rc.N] → build the release (companion tarballs, binaries, install.sh, SHA256SUMS)
# and publish it as a GitHub (pre-)release. Companions come from their own pinned releases.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: agentbox }
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: agentbox/package.json }
      - name: Build
        working-directory: agentbox
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          bun install --frozen-lockfile
          bun scripts/release.ts --targets linux-x64,linux-arm64,darwin-arm64,darwin-x64
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: agentbox
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME}"
          PRE=""; case "$V" in *-*) PRE=--prerelease ;; esac
          gh release create "$V" $PRE --title "agentbox $V" --notes-file docs/release-notes.md \
            apps/agentbox/dist/release/*
